# A 项目统一 motion task 配置入口。
# 当前 Step R-C 只作为四接口 skeleton 的配置模板，不要求完整运行。

target:
  source: offset_from_current
  target_definition: null
  site_name: attachment_site
  body_name: wrist_3_link
  coordinate_frame: world
  position_offset: [0.03, 0.0, 0.0]
  position: null
  orientation_mode: keep_current
  rpy: [0.0, 0.0, 0.0]
  quat_wxyz: [1.0, 0.0, 0.0, 0.0]

ik:
  solver_type: qp_scipy
  task_mode: position
  position_weight: 1.0
  orientation_weight: 0.2
  posture_weight: 0.1
  regularization: 1.0e-4
  gain: 1.0
  dt: 0.02
  max_iters: 100
  tolerance: 1.0e-3

limits:
  velocity_limit: 0.5
  position_margin: 0.05

viewer_target:
  enabled: false
  mode: mouse_keyboard
  derived_mjcf: ../../shared/robot_assets/models/mink_universal_robots_ur5e/scene_a06_mocap_target.xml
  mocap_body_name: a06_target
  mocap_site_name: a06_target_site
  keyboard_step: 0.01
  enable_ik_follow: false
  note: "TODO only. A06 viewer target does not write data.ctrl."

actuator_tracking:
  enabled: false
  trajectory_source: outputs/trajectories/A05_qp_ik_q_traj.npy
  control_mode: position
  note: "A07 only."
