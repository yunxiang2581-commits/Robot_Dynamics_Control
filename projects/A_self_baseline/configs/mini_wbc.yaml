# Mini-WBC QP 教学配置模板

model:
  # URDF 路径: 后续用于动力学和任务 Jacobian
  urdf_path: "../../shared/robot_assets/models/your_robot.urdf"

tasks:
  # base 姿态任务权重: 教学占位
  base_orientation_weight: 1.0
  # 脚端位置任务权重: 教学占位
  foot_position_weight: 1.0
  # 姿态正则项: 避免解过大
  regularization_weight: 0.0001

constraints:
  # 是否启用接触约束: 后续逐步实现
  enable_contact_constraint: false
  # 是否启用关节力矩限制: 后续逐步实现
  enable_torque_limit: false
  # 摩擦系数占位: 用于接触锥约束
  friction_mu: 0.6

solver:
  # QP solver 名称: 当前规划优先 OSQP
  name: "osqp"
  # 最大迭代次数
  max_iter: 1000

output:
  # 输出目录: 保存 QP 维度检查和结构化报告
  directory: "outputs/07_mini_wbc_qp_demo"
