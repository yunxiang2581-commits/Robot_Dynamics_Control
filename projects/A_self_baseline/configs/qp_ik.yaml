# QP-IK 学习配置模板

model:
  # A05 沿用 robot.yaml 中的 mjcf_path，不在这里重复写模型路径。
  # 当前主线是 MuJoCo UR5e scene.xml，而不是旧的 URDF / left_foot 模板。
  target_site: "attachment_site"
  task_mode: "position"
  # A05 第一版沿用 A04 的小位移目标，便于和无约束 DLS 对比。
  target_offset: [0.03, 0.0, 0.0]

weights:
  # position 权重: 越大越重视末端位置任务
  position: 1.0
  # orientation 权重: pose_6d 模式下用于平衡 rad 和 m 的尺度
  orientation: 0.2
  # posture 权重: 让 q 不偏离参考姿态太远
  posture: 0.02
  # 正则权重: 抑制过大关节速度
  regularization: 0.0001

limits:
  # 关节速度上限，A05 中 dq 统一解释为 rad/s
  velocity_limit: 0.5
  # 关节位置上下限安全裕度: 避免积分后越界
  position_margin: 0.05

solver:
  # 支持 scipy 和 osqp；命令行可用 --solver 覆盖
  name: "scipy"
  # A05 中 dq 表示 joint velocity，因此 q_next = integrate(q, dq, dt)
  dt: 0.02
  gain: 1.0
  tolerance: 0.001
  max_iters: 300
  # 单次 QP solver 最大迭代次数
  max_iter: 1000
  # OSQP 收敛容差；scipy 后端会忽略这两个字段
  eps_abs: 0.0001
  eps_rel: 0.0001

output:
  # A05 标准产物仍写入 outputs/trajectories、outputs/logs、outputs/figures、outputs/reports
  directory: "outputs"
