# A_self_baseline 机器人模型配置模板
# 当前阶段: A01 model inspect / MJCF inspect 最小实现已可运行。
# 本文件是 A01-A07 共享的 UR5e / mink-style 模型配置入口。

# 机器人名称:
# - 用途: 日志、报告、JSON summary 中的模型标识。
# - 当前对标: kevinzakka/mink UR5e 示例。
robot_name: ur5e_mink_reference

# 模型类型:
# - 当前 A01 主线检查 MuJoCo MJCF，而不是 URDF/Pinocchio。
model_type: mujoco_mjcf

# MuJoCo MJCF 路径:
# - 当前对标 mink UR5e scene.xml。
# - 相对路径由 A01 的 resolve_path() 按 A_ROOT 解析。
mjcf_path: ../../shared/robot_assets/models/mink_universal_robots_ur5e/scene.xml

# 可选 URDF 路径:
# - 当前不是 A01 主线阻塞项。
# - 后续如果需要 URDF/Pinocchio 对照，再填真实路径。
urdf_path: /path/to/optional/ur5e.urdf

# 固定基设置:
# - UR5e 是固定基 6-DOF 机械臂，当前设置为 false。
# - humanoid/legged 才通常需要 free_flyer: true。
free_flyer: false

# 末端执行器候选:
# - A01 会检查这些名称是否存在于 body/site 等 MuJoCo 对象中。
end_effector_candidates:
  - attachment_site
  - tool0
  - ee_link
  - wrist_3_link

# 模型对象搜索关键词:
# - A01 后续用于筛选 base/shoulder/elbow/wrist/tool/ee/attachment 相关对象。
frame_keywords:
  - base
  - shoulder
  - elbow
  - wrist
  - tool
  - ee
  - attachment

# 标准输出根目录:
# - A01 会写出 reports/A01_model_inspect_report.md 和 cache/A01_model_summary.json。
output_dir: outputs

# 备注:
# - 记录当前 A01 的主线定位和边界。
notes:
  - 第一版对标 mink UR5e 示例
  - 当前不调用 mink 替代自己的实现
  - 当前 A01 已完成最小可运行 model inspect
  - 模型资产位于 shared/robot_assets/models/mink_universal_robots_ur5e/
  - H1 legacy 仅作为历史参考，不是 A 当前主线
