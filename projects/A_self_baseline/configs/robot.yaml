# A 项目机器人模型配置模板

robot:
  # 机器人名称: 用于日志、输出目录和报告标题
  name: "h1"
  # URDF 路径: 当前已确认共享模型资产位于 h1_description 包结构下
  urdf_path: "../../shared/robot_assets/models/h1_description/urdf/h1_with_hand.urdf"
  # MuJoCo XML 路径: 当前默认使用明亮场景文件作为 A06 占位路径
  mujoco_xml_path: "../../shared/robot_assets/models/h1_description/mjcf/scene_with_hand_bright.xml"
  # package 搜索路径: 用于 Pinocchio 查找 mesh/package 资源
  package_dirs:
    - "../../shared/robot_assets/models"
  # 是否使用浮动基: humanoid/legged 常用 true, 固定基教学模型可用 false
  floating_base: true

frames:
  # 目标 frame 名称占位: 后续通过 01_inspect_urdf.py 人工确认
  end_effector: "left_foot"
  # base frame 名称占位: 用于检查坐标系和可视化
  base: "pelvis"
