# A 项目机器人模型配置模板

robot:
  # 机器人名称: 用于日志、输出目录和报告标题
  name: "your_robot"
  # URDF 路径: 优先使用共享资源的相对路径示例, 不要写死旧项目路径
  urdf_path: "../../shared/robot_assets/models/your_robot.urdf"
  # MuJoCo XML 路径: 用于后续 MuJoCo PD 或仿真实验
  mujoco_xml_path: "../../shared/robot_assets/models/your_robot.xml"
  # package 搜索路径: 用于 Pinocchio 查找 mesh/package 资源
  package_dirs:
    - "../../shared/robot_assets/models"
  # 是否使用浮动基: humanoid/legged 常用 true, 固定基教学模型可用 false
  floating_base: true

frames:
  # 目标 frame 名称占位: 后续通过 01_inspect_urdf.py 人工确认
  end_effector: "left_foot"
  # base frame 名称占位: 用于检查坐标系和可视化
  base: "base_link"
