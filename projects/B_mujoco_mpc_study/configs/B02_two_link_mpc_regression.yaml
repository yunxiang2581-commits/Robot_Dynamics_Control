# B02 二连杆 MPC tracking 轻量回归配置
#
# 目的：
# - 作为日常 regression baseline
# - 保留 video + figures + metrics + log 全链路
# - 控制运行时长，方便频繁回归
#
# 注意：
# - 这个文件不替代正式验收配置 `B02_two_link_mpc.yaml`
# - 正式 benchmark 仍使用 1000 steps / 768 candidates 的 10Nm 配置

model:
  path: simulator/models/B02_two_link.xml
  end_effector_site: ee_site

target_trajectory:
  type: figure8
  center: [0.58, 0.28]
  radius: 0.08
  x_amplitude: 0.16
  y_amplitude: 0.09
  angular_speed: 0.6

initial_state:
  q: [0.3, 0.4]
  dq: [0.0, 0.0]

simulation:
  dt: 0.01
  num_steps: 100

mpc:
  horizon: 8
  num_candidates: 64
  torque_limit: 10.0

cost:
  ee_weight: 80.0
  dq_weight: 0.1
  torque_weight: 0.002
  terminal_weight: 10.0

outputs:
  root: outputs/runs
  run_id:
  export_video: true
  save_figures: true
  save_metrics: true

viewer:
  show: false
  real_time: false
